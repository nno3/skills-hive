<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/forgot-password.css"> <!-- Ensure the CSS file is linked -->
</head>
<body>
<div class="forgot-password-container">
    <!-- Form Side -->
    <div class="form-side">
        <h2>Oops! Forgot your password?</h2>
        <p>Don’t worry, just fill out the form below to get back on track.</p>
        <form action="/reset-password" method="post">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="securityQuestion1">Security Question 1:</label>
                <select id="securityQuestion1" name="securityQuestion1" required>
                    <option value="">Select a security question</option>
                    <option value="What is your mother's maiden name?">What is your mother's maiden name?</option>
                    <option value="What was the name of your first pet?">What was the name of your first pet?</option>
                    <option value="What is your favorite book?">What is your favorite book?</option>
                    <option value="What city were you born in?">What city were you born in?</option>
                    <option value="What is your favorite color?">What is your favorite color?</option>
                </select>
            </div>
            <div class="form-group">
                <label for="securityAnswer1">Answer:</label>
                <input type="text" id="securityAnswer1" name="securityAnswer1" required>
            </div>
            <div class="form-group">
                <label for="securityQuestion2">Security Question 2:</label>
                <select id="securityQuestion2" name="securityQuestion2" required>
                    <option value="">Select a security question</option>
                    <option value="What is your mother's maiden name?">What is your mother's maiden name?</option>
                    <option value="What was the name of your first pet?">What was the name of your first pet?</option>
                    <option value="What is your favorite book?">What is your favorite book?</option>
                    <option value="What city were you born in?">What city were you born in?</option>
                    <option value="What is your favorite color?">What is your favorite color?</option>
                </select>
            </div>
            <div class="form-group">
                <label for="securityAnswer2">Answer:</label>
                <input type="text" id="securityAnswer2" name="securityAnswer2" required>
            </div>
            <button type="submit" class="primary-button">Reset Password</button>
        </form>
        <p class="form-footer">Remember your password? <a href="/login">Login here</a>.</p>
        <!-- Display error message if it exists -->
        <div th:if="${errorMessage}" class="error-message" th:text="${errorMessage}"></div>
    </div>
</div>
</body>
</html>
