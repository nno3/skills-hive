<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><script src="/skills-hive/tester-static.js"></script>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Search</title>
    <link rel="stylesheet" href="/skills-hive/css/course.css">
    <link rel="stylesheet" href="/skills-hive/css/sidebar.css">
    <link rel="stylesheet" href="/skills-hive/css/bookmark-preview.css"><!-- Add sidebar CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
<style>
#tester-banner{position:sticky;top:0;z-index:10000;background:#3d3200;color:#fff8dc;text-align:center;padding:10px 16px;font-family:Poppins,sans-serif;font-size:14px;line-height:1.4}
#tester-banner strong{color:#FFD700}
</style>
<div id="tester-banner"><strong>Tester account.</strong> This is sample data, so you can look around without registering.</div>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <!-- Logo -->
    <div class="sidebar-logo">
        <img src="/skills-hive/photos/Screenshot%202025-02-10%20at%2016.14.57.png" alt="SYNTHETVB Logo">
    </div>

    <!-- Toggle Button -->
    <div class="sidebar-toggle" id="sidebar-toggle"><span>&#9776;</span> <!-- Hamburger Icon --></div>

    <!-- Sidebar Options -->
    <ul class="sidebar-menu">
        <li><a href="/skills-hive/dashboard/"><i class="fas fa-home"></i><span>Dashboard</span></a></li>
        <li class="active"><a href="/skills-hive/course/"><i class="fa-solid fa-book-open"></i><span>Courses</span></a></li>
        <li class="bookmark-list-item">
            <!-- Bookmark Icon -->
            <div class="bookmark-sidebar" onmouseover="showBookmarkPreview()" onmouseout="hideBookmarkPreview()" onclick="redirectToBookmarks()">
                <i class="fas fa-bookmark"></i><span> Bookmarks</span>
            </div>
            <!-- Bookmark Preview (Initially hidden) -->
            <div id="bookmark-preview" style="display: none;">
                <h4>Bookmarked Courses</h4>
                <ul id="bookmark-preview-list"></ul>
            </div>
        </li>

        <li><a href="/skills-hive/leaderboard/"><i class="fas fa-trophy"></i><span>Leaderboard</span></a></li>
        <li><a href="/skills-hive/friends/"><i class="fas fa-users"></i><span>Friends</span></a></li>
        <li><a href="/skills-hive/hexahive/"><i class="fas fa-gamepad"></i><span>HexaHive</span></a></li>
        <li><a href="/skills-hive/profile/"><i class="fas fa-user"></i><span>User Profile</span></a></li>
        <li>
            <form action="/skills-hive/" method="post" style="display: inline;">
                <button type="submit" style="background: none; border: none; cursor: pointer; color: inherit; font: inherit;">
                    <i class="fas fa-sign-out-alt"></i><span> Log Out</span>
                </button>
            </form>
        </li>
    </ul>
</div>

<!-- Main Content -->
<div class="main-content" id="main-content">
    <header>
        <h1>Course Search</h1>
        <div id="search-form">
            <input type="text" id="search-input" placeholder="Search by title or description">
            <select id="category-filter">
                <option value="">All Categories</option><option value="AI">AI</option><option value="Data Science">Data Science</option><option value="Cloud Computing">Cloud Computing</option><option value="Cybersecurity">Cybersecurity</option>
                
            </select>
            <select id="level-filter">
                <option value="">All Levels</option><option value="Beginner">Beginner</option><option value="Intermediate">Intermediate</option><option value="Advanced">Advanced</option>
                
            </select>
            <button class="search-button" onclick="searchAndFilterCourses()">Search</button>
        </div>
    </header>

    <main>
        <div id="course-list" class="course-list">
            
        </div>
    </main>
</div>

<!-- Reviews Modal (Adding it to ensure it's present) -->
<div id="reviews-modal-overlay" class="modal-overlay" style="display: none;">
  <div id="reviews-modal-content" class="modal-content">
    <span id="reviews-close" class="modal-close">&times;</span>
    <h2>Course Reviews</h2>
    <p id="review-count">0 Reviews</p>
    <div id="reviews-list"></div>
  </div>
</div>

<!-- Make sure the Font Awesome is included -->
<script src="https://kit.fontawesome.com/4af7d25044.js" crossorigin="anonymous"></script>
<!-- JavaScript files -->
<script src="/skills-hive/script/sidebar.js"></script>
<script src="/skills-hive/script/course.js"></script>
<script src="/skills-hive/script/bookmark.js"></script>

</body>
</html>
